<!DOCTYPE html>
<html>

<head>
    <title>Pet Adoption Centre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .pet {
            border: 2px solid #ccc;
            margin: 10px;
            padding: 15px;
        }

        .available {
            border-color: green;
        }

        .adopted {
            border-color: red;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <h1>Happy Paws Adoption Centre</h1>
    <div id="pet-list"></div>

    <script>
        let pets = [
            { name: "Garfield", type: "cat", age: 3, adopted: false },
            { name: "Bronx", type: "dog", age: 5, adopted: true },
            { name: "Ada", type: "dog", age: 2, adopted: true },
            { name: "Buck", type: "cat", age: 13, adopted: true },
        ];

        function displayPet(pet) {
            let status = pet.adopted ? "Adopted" : "Available";
            let cssClass = pet.adopted ? "pet adopted" : "pet available";

            let html = `

            <div class="${cssClass}">
                <h2>${pet.name}</h2>
                <p>Type: ${pet.type}</p>
                <p>Age: ${pet.age}</p>
                <p>${pet.adopted ? "Adopted" : "Available for adoption"}</p>
            </div>
            `;
            return html;
        }

        function showAllPets() {
            const petListDiv = document.getElementById('pet-list');

            for (const x of pets)
                petListDiv.innerHTML += displayPet(x);
        }

        function adoptPet(petName) {
            for (let i = 0; i < pets.length; i++)
                if (pets[i].name === petName) {
                   pets[i].adopted = true; 
                }
                
            //showAllPets();   
        }
        //adoptPet("Garfield");
        showAllPets();       
        
    </script>
</body>

</html>
